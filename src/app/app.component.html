<header class="header">
  <div class="container header__container">
    <div class="header__logo">
      <img src="/icons/mountains-icon.svg" alt="mountains">
      <h2 class="header__logo-title">{{companyName}}</h2>
    </div>

    <nav class="header__nav">
      <ul class="header__nav-list">
        <li><a href="#">Главная</a></li>
        <li><a href="#">Про гида</a></li>
        <li><a href="#">Программа тура</a></li>
        <li><a href="#">Стоимость</a></li>
        <li><a href="#">Блог</a></li>
        <li><a href="#">Контакты</a></li>
      </ul>
    </nav>

    <button class="header__cta">Консультация</button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="container hero__container">
      <h1 class="hero__title">Насладись прогулкой в горах<br>с командой единомышленников</h1>

      <form action="" class="hero__cta hero__cta-form">
        <div class="hero__cta-field">
          <select name="tour-location" id="tour-location-select" class="hero__cta-select">
            <option value="" disabled selected hidden>Локация для тура</option>
            <option value="mountains">Кавказские горы</option>
            <option value="altay">Алтай</option>
          </select>
          <span class="hero__cta-hint">выберите из списка</span>
        </div>

        <div class="hero__cta-field">
          <input type="text" placeholder="Дата похода" onfocus="this.type='date'; this.showPicker()"
            onblur="if(!this.value) this.type='text'" class="hero__cta-input">
          <span class="hero__cta-hint">укажите дату</span>
        </div>

        <div class="hero__cta-field">
          <select name="members" id="members-select" class="hero__cta-select">
            <option value="" disabled selected hidden>Участники</option>
            <option value="1">1 человек</option>
            <option value="2">2 человека</option>
          </select>
          <span class="hero__cta-hint">выберите из списка</span>
        </div>

        <button type="submit" class="btn">Найти программу</button>
      </form>
    </div>
  </section>
</main>
